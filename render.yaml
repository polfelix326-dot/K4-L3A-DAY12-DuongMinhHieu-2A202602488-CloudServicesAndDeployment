# CP5 — Cấu hình deploy Render (dùng nếu bạn chọn Render).
#
# Render đọc file này khi bạn tạo Blueprint từ repo GitHub.
# `sync: false` = Render hỏi giá trị lúc deploy, KHÔNG lưu secret vào repo.

services:
  - type: web
    name: day12-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    # Phải TRÙNG region với day12-redis, nếu không private network không nối được.
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AGENT_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: MONTHLY_BUDGET_USD
        value: "10.0"
      - key: REDIS_URL
        fromService:
          name: day12-redis
          type: keyvalue
          property: connectionString

  - type: keyvalue
    name: day12-redis
    region: oregon
    plan: free
    # `connectionString` trả về URL *private network*, nên chặn toàn bộ
    # truy cập từ Internet là an toàn mà vẫn kết nối được.
    ipAllowList: []
    # KHÔNG được để allkeys-lru: rate-limit và cost-guard phụ thuộc key
    # không bị evict, mất key = nghĩa sai nghiệp vụ.
    maxmemoryPolicy: noeviction
    # Free tier không hỗ trợ persistence, Render tự đặt là off.
